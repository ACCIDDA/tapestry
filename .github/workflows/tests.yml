name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # R scoringutils is required by the scoring and EpiBench tests.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::scoringutils
            any::purrr
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
