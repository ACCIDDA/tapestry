name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: python -m pip install '.[docs]'
      - name: Build documentation
        run: python -m mkdocs build --strict --site-dir site
      # The published explorer is static: MkDocs copies the committed export in
      # docs/explorer/data/, and the app itself comes from the packaged sources.
      - name: Add published explorer
        run: |
          test -f site/explorer/data/catalog.json
          test -f site/explorer/data/revisions.parquet
          cp src/tapestry/explorer/static/index.html src/tapestry/explorer/static/app.js \
             src/tapestry/explorer/static/style.css site/explorer/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v5
