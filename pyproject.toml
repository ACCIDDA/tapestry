[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tapestry"
version = "0.1.0"
description = "Surveillance data, nowcasting, forecasting, evaluation, and exploration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ACCIDDA" }]
dependencies = ["epidatpy>=0.6.0,<0.7"]

[project.optional-dependencies]
dataset = ["numpy>=1.24", "pandas>=2"]
# torch is pinned to the CUDA 12.6 build: it is the newest wheel line whose
# compiled architectures still include sm_70 (V100). CUDA 13 wheels dropped it,
# which locks the 80-card volta-gpu partition out. sm_89 (L40/L40S) is covered by
# binary compatibility with the sm_86 cubin, verified on g1803jles01; sm_80 and
# sm_90 are native. PyTorch stops publishing cu126 wheels at 2.15, so do not
# let `uv sync --upgrade` move this pin without re-checking the arch list.
model = ["numpy>=1.24", "torch==2.9.1"]
evaluation = ["numpy>=1.24", "pandas>=2", "scipy>=1.11", "pyarrow>=10", "torch==2.9.1", "matplotlib>=3.8", "seaborn>=0.13"]
explorer = ["pyarrow>=10"]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocstrings[python]>=0.29,<1",
]

[dependency-groups]
# The default checkout environment covers training, evaluation, exploration and tests.
dev = ["tapestry[model,explorer,evaluation]", "pytest>=8"]

[tool.uv.sources]
# Without this mapping torch resolves from PyPI, which now ships CUDA 13 only.
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.scripts]
tapestry-dataset = "tapestry.dataset.build:main"
tapestry-data = "tapestry.data.cli:main"
tapestry-select = "tapestry.data.selection:main"
tapestry-explore = "tapestry.explorer:main"
tapestry-experiment = "tapestry.experiment.planner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tapestry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
