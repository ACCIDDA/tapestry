site_name: Tapestry
site_url: https://accidda.github.io/tapestry/
repo_url: https://github.com/ACCIDDA/tapestry
site_description: Vintage-aware surveillance data repository and local explorer
docs_dir: docs

extra_css:
  - stylesheets/tapestry.css

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Architecture: design/architecture.md
  - Getting started: getting-started.md
  - Longleaf setup: longleaf-setup.md
  - B0:
      - Definition and implementation: data/build-b-finalized.md
      - Scored results:
          - Report and rankings: results/b0-configuration-comparison.md
          - Influenza admissions 2023–2024: results/b0-comparison/flusight_flu_hosp_2023-2024.md
          - Influenza admissions 2024–2025: results/b0-comparison/flusight_flu_hosp_2024-2025.md
          - Influenza admissions 2025–2026: results/b0-comparison/flusight_flu_hosp_2025-2026.md
          - Influenza ED 2025–2026: results/b0-comparison/flusight_flu_prop_ed_visits_2025-2026.md
          - COVID admissions 2024–2025: results/b0-comparison/covid_covid_hosp_2024-2025.md
          - COVID admissions 2025–2026: results/b0-comparison/covid_covid_hosp_2025-2026.md
          - COVID ED 2025–2026: results/b0-comparison/covid_covid_prop_ed_visits_2025-2026.md
          - RSV admissions 2025–2026: results/b0-comparison/rsv_rsv_hosp_2025-2026.md
          - RSV ED 2025–2026: results/b0-comparison/rsv_rsv_prop_ed_visits_2025-2026.md
  - Data repository:
      - Overview: data/index.md
      - Source catalog: data/sources.md
      - Shared selection: data/selection.md
      - Storage and provenance: data/storage.md
      - Vintages and geography: data/vintages-and-geography.md
  - Explorer:
      - Overview: explorer/index.md
      - Filters and interpretation: explorer/filters.md
      - Local API: explorer/api.md
  - Reference:
      - Command line: reference/cli.md
      - Python API: reference/python-api.md
  - Development: development.md
  - Mac and Longleaf: development-longleaf.md
  - Current workflows:
      - Training and prediction: workflows/training.md
      - Experiment manager: workflows/experiment-manager.md
      - Frozen hub support: workflows/hub-evaluation.md
      - EpiBench scoring and reports: workflows/configuration-evaluation.md
      - Emily’s challenge configs: workflows/emily-configs.md
  - Features and tests: maintenance.md
