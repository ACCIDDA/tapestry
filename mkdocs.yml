site_name: Tapestry
site_url: https://accidda.github.io/tapestry/
repo_url: https://github.com/ACCIDDA/tapestry
site_description: Probabilistic epidemic nowcasting and forecasting
docs_dir: docs

extra_css:
  - stylesheets/tapestry.css

extra_javascript:
  - javascripts/explorer-link.js

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - scripts/docs_hooks.py

nav:
  - Intro: index.md
  - Architecture / reflection: architecture.md
  - Workflow:
      - Workflow: workflow.md
      - Setup: setup.md
  - Experiments:
      - Model runs: experiments/index.md
  - Data:
      - Overview: data/index.md
      - Interactive staircase: data/staircase.md
      - Sources: data/sources.md
      - Selection and provenance: data/methods.md
      - Panel diagnostics: data/panel.md
      - Explorer: explorer/overview.md
      - Explorer filters: explorer/filters.md
  - Reference:
      - Commands: reference/cli.md
      - Scenario fields: reference/scenario.md
      - Python API: reference/python-api.md
      - Other models: reference/other-models.md
      - FluSight model review: reference/flusight-2025-2026-model-review.md
      - Explorer API: explorer/api.md
      - Development: development.md
