site_name: Tapestry
site_url: https://accidda.github.io/tapestry/
repo_url: https://github.com/ACCIDDA/tapestry
site_description: Vintage-aware surveillance data repository and local explorer
docs_dir: docs

extra_css:
  - stylesheets/tapestry.css

extra_javascript:
  - javascripts/explorer-link.js

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture: design/architecture.md
  - Getting started: getting-started.md
  - Longleaf setup: longleaf-setup.md
  - B0:
      - Definition and implementation: data/build-b-finalized.md
      - B0.0 results: results/b0-crosses/index.md
      - B0.0 follow-up and adopted objective: results/b0-crosses/next-steps.md
      - B0.1 experiment specification: design/b0.1.md
      - B0.1 results: results/b0-1-crosses/index.md
      - Crosses calibration (legacy, pre-scaling-fix): results/b0-crosses-legacy/index.md
  - B1:
      - Masked-vintage model: design/b1.md
      - Screen and 300-epoch results: results/b1-overnight/index.md
  - B2:
      - Covariate results and diagnosis: results/B2-screen/index.md
      - Kinsa-only results: results/B2-kinsa/index.md
      - Covariate experiment: design/b2.md
      - Dataset and vintage support: data/b2.md
  - Data repository:
      - Overview: data/index.md
      - Source catalog: data/sources.md
      - Shared selection: data/selection.md
      - Storage and provenance: data/storage.md
      - Vintages and geography: data/vintages-and-geography.md
      - Wastewater (WVAL and Delphi NWSS): data/wastewater.md
      - Clinical covariates (claims, PopHIVE): data/covariates.md
      - Kinsa cough, cold and flu (PopHIVE): data/kinsa.md
      - Panel analysis (truth fallback, revisions): data/panel.md
  - Explorer:
      - Live explorer: https://accidda.github.io/tapestry/explorer/
      - Overview: explorer/overview.md
      - Filters and interpretation: explorer/filters.md
      - Local API: explorer/api.md
  - Reference:
      - Command line: reference/cli.md
      - Scenario fields: reference/scenario.md
      - Python API: reference/python-api.md
  - Development: development.md
  - Mac and Longleaf: development-longleaf.md
  - Current workflow: workflows/training.md
  - Features and tests: maintenance.md
