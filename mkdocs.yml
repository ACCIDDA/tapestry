site_name: Tapestry
site_url: https://accidda.github.io/tapestry/
repo_url: https://github.com/ACCIDDA/tapestry
site_description: Vintage-aware surveillance data repository and local explorer
docs_dir: docs

extra_css:
  - stylesheets/tapestry.css

extra_javascript:
  - javascripts/explorer-link.js

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Current workflow: workflows/training.md
  - Unified model design: design/restructure-2026-unified.md
  - Architecture: design/architecture.md
  - Longleaf setup: longleaf-setup.md
  - Results:
      - kinsa-finalized-5seeds: results/kinsa-finalized-5seeds/index.md
  - Data repository:
      - Overview: data/index.md
      - Source catalog: data/sources.md
      - Shared selection: data/selection.md
      - Storage and provenance: data/storage.md
      - Vintages and geography: data/vintages-and-geography.md
      - Wastewater (WVAL and Delphi NWSS): data/wastewater.md
      - Clinical covariates (claims, PopHIVE): data/covariates.md
